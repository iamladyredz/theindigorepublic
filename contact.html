<body>

<header class="site-header">
  <div class="bar">
    <a href="index.html" class="wordmark">The Indigo<span class="dot">.</span>Republic</a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Our Services</a></li>
        <li><a href="video.html">Video</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="contact.html" aria-current="page">Contact Us</a></li>
      </ul>
    </nav>
    <a href="contact.html" class="header-cta">Let's talk</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <section class="connect">
    <div class="connect-wrap">

      <div class="connect-col connect-title">
        <span class="dot"></span>
        <h1>Let's Connect</h1>
      </div>

      <div class="connect-col connect-info">
        <p>Servicing Maryland,<br>Washington, D.C, and Virginia</p>
        <a href="tel:+12405483771">240-548-3771</a>
        <a href="mailto:info@TheIndigoRepublic.com">info@TheIndigoRepublic.com</a>
      </div>

      <div class="connect-col">
        <form action="mailto:info@TheIndigoRepublic.com" method="post" enctype="text/plain">
          <div class="row-2">
            <div class="field">
              <label for="fname">First Name</label>
              <input id="fname" name="First Name" type="text">
            </div>
            <div class="field">
              <label for="lname">Last Name</label>
              <input id="lname" name="Last Name" type="text">
            </div>
          </div>
          <div class="row-2">
            <div class="field">
              <label for="email">Email*</label>
              <input id="email" name="Email" type="email" required>
            </div>
            <div class="field">
              <label for="subject">Subject</label>
              <input id="subject" name="Subject" type="text">
            </div>
          </div>
          <div class="field">
            <label for="message">Leave us a message...</label>
            <textarea id="message" name="Message" rows="5"></textarea>
          </div>
          <button type="submit" class="btn-wix-orange">Submit</button>
          <p class="note">This form opens your email client with the message pre-filled.</p>
        </form>
      </div>

    </div>
  </section>

  <footer class="page-footer">&copy; <span id="year"></span> by Indigo Republic Films</footer>

</main>

<div id="preview-card"><div class="art"></div><div class="label"></div></div>
<script src="assets/js/main.js"></script>
</body>
</html>
